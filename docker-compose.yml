version: '3.8'

services:
  # 1. Hardened Backend API & Stream Proxy Gateway
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: transitsense-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transitsense_db
      - DB_USER=transitsense_app
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=https://transitsense.gov.in
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
    networks:
      - transitsense-internal
    security_opt:
      - no-new-privileges:true

  # 2. Redis for Sliding-Window Rate Limiting (100 req/min/IP)
  redis:
    image: redis:7.2-alpine
    container_name: transitsense-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - transitsense-internal

  # 3. PostgreSQL + PostGIS (Spatial Analytics & Heatmap Storage)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: transitsense-postgis
    restart: always
    environment:
      - POSTGRES_DB=transitsense_db
      - POSTGRES_USER=transitsense_app
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - transitsense-internal

  # 4. ML Inference Stream Proxy (TensorRT YOLOv11 + ByteTrack)
  ml-engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: transitsense-ml-engine
    restart: always
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - MODEL_ENGINE=/models/yolov11x_traffic_int8.engine
      - RTSP_BACKEND_PORT=8554
    volumes:
      - ./ml_engine/models:/models:ro
    networks:
      - transitsense-internal

networks:
  transitsense-internal:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
